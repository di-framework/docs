name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_reindex:
        description: Re-embed every document
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [framework-release, coverage-update]

concurrency:
  group: docs-production
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SEARCH_URL: https://di-framework-docs-search.seemueller.workers.dev/api/docs/search
  OIDC_AUDIENCE: di-framework-docs-search

jobs:
  sync_release:
    name: Synchronize the published framework release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      main_sha: ${{ steps.sync.outputs.main_sha }}
      should_deploy: ${{ steps.sync.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: release
        name: Resolve the current npm release and matching docs snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://registry.npmjs.org/@di-framework%2Fcore/latest | jq -er .version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::npm returned a non-stable @di-framework/core version: $version"
            exit 1
          fi
          tag="v$version"
          released_at="$(gh api "repos/di-framework/di-framework/commits/$tag" --jq .commit.committer.date)"
          git fetch origin main
          snapshot_sha="$(git rev-list -1 --before="$released_at" origin/main)"
          if [[ -z "$snapshot_sha" ]]; then
            echo "::error::no documentation commit exists before framework release $tag ($released_at)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "released_at=$released_at"
            echo "snapshot_sha=$snapshot_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $tag to docs snapshot $snapshot_sha ($released_at)"
      - id: sync
        name: Update the managed snapshot and selector manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.release.outputs.version }}
          SNAPSHOT_SHA: ${{ steps.release.outputs.snapshot_sha }}
        run: |
          set -euo pipefail
          result="$(python3 scripts/sync-supported-version.py supported-versions.json "$VERSION")"
          branch="$(jq -r .branch <<<"$result")"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk '{print $1}')"
          changed=false

          if [[ "$remote_sha" != "$SNAPSHOT_SHA" ]]; then
            if [[ -n "$remote_sha" ]]; then
              git push --force-with-lease="refs/heads/$branch:$remote_sha" \
                origin "$SNAPSHOT_SHA:refs/heads/$branch"
            else
              git push --force-with-lease="refs/heads/$branch:" \
                origin "$SNAPSHOT_SHA:refs/heads/$branch"
            fi
            changed=true
          fi

          if ! git diff --quiet -- supported-versions.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supported-versions.json
            git commit -m "chore(docs): track framework v$VERSION"
            git push origin HEAD:main
            changed=true
          fi

          main_sha="$(git rev-parse HEAD)"
          should_deploy=true
          if [[ "$EVENT_NAME" == "schedule" && "$changed" == "false" ]]; then
            should_deploy=false
          fi
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "Managed $branch at $SNAPSHOT_SHA; main is $main_sha; changed=$changed"

  versions:
    needs: sync_release
    if: needs.sync_release.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      main_sha: ${{ steps.versions.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync_release.outputs.main_sha }}
      - id: versions
        env:
          MAIN_SHA: ${{ needs.sync_release.outputs.main_sha }}
        run: |
          echo "matrix=$(jq -c . supported-versions.json)" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

  worker:
    name: Deploy or validate search Worker
    needs: sync_release
    if: needs.sync_release.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.sync_release.outputs.main_sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Build Worker bundle
        run: bun x wrangler deploy --dry-run --config search/wrangler.jsonc
      - name: Deploy Worker before frontend
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: bun x wrangler deploy --config search/wrangler.jsonc
      - name: Explain credential-free validation
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo 'Cloudflare secrets are not configured; requiring the deployed Worker to pass its production contract.'
      - name: Validate production Worker contract
        run: |
          set -euo pipefail
          curl -fsS "$SEARCH_URL/"
          code="$(curl -sS -o /tmp/search.json -w '%{http_code}' "$SEARCH_URL/preview-search/Writerside/d/latest?query=installation")"
          test "$code" = 200
          jq -e 'has("hits") or has("results")' /tmp/search.json >/dev/null

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        docs: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: Build ${{ matrix.docs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versions.outputs.main_sha }}
          path: tooling
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.docs.ref == 'main' && needs.versions.outputs.main_sha || matrix.docs.ref }}
          path: source
      - name: Build Writerside
        uses: JetBrains/writerside-github-action@738910d7cf197d67188300d0e0f84b2e708db3cf # v4
        with:
          instance: Writerside/d
          location: source
          docker-version: 2.1.1479-p3869
          artifact: webHelpD2-all.zip
      - name: Prepare versioned site
        run: |
          set -euo pipefail
          mkdir -p "built/${{ matrix.docs.version }}"
          unzip -O UTF-8 -qq artifacts/webHelpD2-all.zip -d "built/${{ matrix.docs.version }}"
          python3 tooling/scripts/patch-site.py "built/${{ matrix.docs.version }}" "${{ matrix.docs.version }}" "$SEARCH_URL"
          cp source/Writerside/images/favicon.png "built/${{ matrix.docs.version }}/favicon.png"
          cp source/Writerside/images/favicon.png "built/${{ matrix.docs.version }}/favicon.ico"
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.docs.version }}
          path: built/${{ matrix.docs.version }}
          if-no-files-found: error

  index:
    name: Index every deployed version
    needs: [versions, worker, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versions.outputs.main_sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Build combined corpus from maintained branches
        env:
          MAIN_SHA: ${{ needs.versions.outputs.main_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/docs-corpora /tmp/docs-sources
          while IFS=$'\t' read -r version ref; do
            safe="${version//\//-}"
            mkdir -p "/tmp/docs-sources/$safe"
            archive_ref="origin/$ref"
            test "$ref" = main && archive_ref="$MAIN_SHA"
            git archive "$archive_ref" Writerside | tar -x -C "/tmp/docs-sources/$safe"
            DOCS_VERSION="$version" TOPICS_DIR="/tmp/docs-sources/$safe/Writerside/topics" \
              CORPUS_OUT="/tmp/docs-corpora/$safe.json" bun run corpus
          done < <(jq -r '.[] | [.version,.ref] | @tsv' supported-versions.json)
          jq -s '{generatedAt: now | todate, docs: map(.docs) | add}' /tmp/docs-corpora/*.json > /tmp/corpus.json
          jq -e '.docs | length > 0' /tmp/corpus.json >/dev/null
      - name: Mint short-lived reindex token
        id: auth
        run: |
          set -euo pipefail
          oidc="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE" | jq -r .value)"
          echo "::add-mask::$oidc"
          response="$(curl -fsS -X POST "$SEARCH_URL/auth/token" -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json')"
          token="$(jq -r .access_token <<<"$response")"
          test -n "$token" && test "$token" != null
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Reindex
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          FULL_REINDEX: ${{ inputs.full_reindex || false }}
        run: |
          set -euo pipefail
          endpoint="$SEARCH_URL/reindex"
          test "$FULL_REINDEX" = true && endpoint="$endpoint?full=1"
          code="$(curl -sS -o /tmp/result.json -w '%{http_code}' -X POST "$endpoint" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' --data-binary @/tmp/corpus.json)"
          cat /tmp/result.json
          test "$code" = 200
          jq -e '.ok == true' /tmp/result.json >/dev/null

  deploy:
    name: Publish one atomic Pages tree
    needs: [versions, build, index]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versions.outputs.main_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: builds
      - name: Fetch latest coverage badges from di-framework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p coverage
          gh run download --repo di-framework/di-framework --name coverage-badges --dir coverage || true
      - name: Normalize artifact layout and assemble
        run: |
          set -euo pipefail
          for artifact in builds/site-*; do
            version="${artifact#builds/site-}"
            mv "$artifact" "builds/$version"
          done
          python3 scripts/assemble-site.py builds site supported-versions.json
          echo docs.di-framework.dev > site/CNAME
          jq -e --slurpfile supported supported-versions.json '
            map({version, isCurrent}) == ($supported[0] | map({version, isCurrent}))
          ' site/versions.json >/dev/null
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v5

  smoke:
    name: Production smoke tests
    needs: [versions, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versions.outputs.main_sha }}
      - name: Verify navigation, versions, and scoped search
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            if curl -fsS https://docs.di-framework.dev/versions.json -o /tmp/versions.json; then break; fi
            sleep 10
          done
          jq -e --slurpfile supported supported-versions.json '
            map({version, isCurrent}) == ($supported[0] | map({version, isCurrent}))
          ' /tmp/versions.json >/dev/null
          while IFS=$'\t' read -r version path; do
            config_url="https://docs.di-framework.dev${path%/}/config.json"
            curl -fsS "$config_url" -o "/tmp/config-${version}.json"
            jq -e --arg version "$version" '.productVersion == $version' "/tmp/config-${version}.json" >/dev/null
            curl -fsS "https://docs.di-framework.dev${path%/}/overview.html" >/dev/null
            curl -fsS "$SEARCH_URL/preview-search/Writerside/d/$version?query=installation" | jq -e 'has("hits") or has("results")' >/dev/null
          done < <(jq -r '.[] | [.version,.path] | @tsv' supported-versions.json)
          curl -fsS https://docs.di-framework.dev/coverage/core.json | jq -e '.label == "line coverage" and .color == "brightgreen"' >/dev/null
